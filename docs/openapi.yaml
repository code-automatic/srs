        functionName: {type: string, example: null, nullable: true}
        timeLimitMs: {type: integer, example: 1000, minimum: 1}
        memoryLimitMb: {type: integer, example: 128, minimum: 1}
        outputLimitBytes: {type: integer, example: 1048576, minimum: 1}
        sampleTestCases:
