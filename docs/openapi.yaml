      description: Tags retrieved
      security: []
      x-implementation-status: target-not-implemented
      x-owner: api_gateway
      x-feature: F04
      x-priority: Should
      responses:
        '200':
          description: Tags retrieved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListTagsResponse'}
              example:
                status: success
