      description: Only active languages, stable ordering slug then id. Python 3.12, C++17, Java17 target runtimes. Hide Piston
        selector/version internals.
      security: []
      x-implementation-status: target-not-implemented
      x-owner: api_gateway
      x-feature: F03
      x-priority: Must
      responses:
        '200':
          description: Languages retrieved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListLanguagesResponse'}
              example:
                status: success
                code: 200
                message: Languages retrieved
                data:
                  items:
                  - {id: 11111111-1111-4111-8111-111111111111, slug: python3, name: Python 3, runtimeVersion: '3.12', fileExtension: .py}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '405': {$ref: '#/components/responses/Error405'}
        '409': {$ref: '#/components/responses/Error409'}
