# Target-only /api/v1 contract, not evidence of implemented endpoints.
openapi: 3.0.3
info:
  title: Codjingrank Gateway API v1
  version: 2.1.0-contract
  description: TARGET CONTRACT FOR MOCKS — not a live API inventory. All /api/v1 operations require backend implementation/integration.
    One shared UUID database. Current root routes/DTOs are NOT compatible automatically. See FRONTEND_API_CONTRACT.md for
    access, migration and schema-extension notes. No GitHub/repository/old curriculum routes. Priority Could/Should is coverage,
    not a delivery promise.
servers:
- {url: 'http://localhost:8080', description: Target Gateway; run a mock on port4010 until runtime implementation}
- {url: 'http://localhost:4010', description: Prism mock server}
tags:
- {name: Auth, description: Owned by auth_service}
- {name: Profile, description: Owned by auth_service}
- {name: Landing, description: Owned by api_gateway}
- {name: Catalog, description: Owned by api_gateway}
- {name: Run, description: Owned by run_service}
- {name: Submissions, description: Owned by submission_service}
- {name: Progress, description: Owned by submission_service}
- {name: Leaderboard, description: Owned by api_gateway}
- {name: Forum, description: Owned by forum_service}
- {name: AI, description: Owned by ai_service}
- {name: Admin users, description: Owned by auth_service}
- {name: Admin catalog, description: Owned by api_gateway}
- {name: Admin submissions, description: Owned by submission_service}
- {name: Admin forum, description: Owned by forum_service}
- {name: Admin dashboard, description: Owned by api_gateway}
- {name: Daily challenge, description: Owned by api_gateway}
security:
- bearerAuth: []
paths:
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Account created
      tags:
      - Auth
      description: 'Registers student only; role/isActive supplied by client are rejected. Case-insensitive unique email and
        username; conflicts: EMAIL_EXISTS or USERNAME_EXISTS (409). Target password policy is stricter than current six-character
        DTO.'
      security: []
      x-implementation-status: target-not-implemented
      x-owner: auth_service
      x-feature: F01
      x-priority: Must
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
            example: {email: learner@example.com, username: bradar, password: Coding2026, fullName: Trung Hieu}
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegisterResponse'}
              example:
                status: success
                code: 201
                message: Account created
                data:
                  accessToken: mock-access-token
                  user:
                    id: 11111111-1111-4111-8111-111111111111
                    email: learner@example.com
                    username: bradar
                    fullName: Trung Hieu
                    avatarUrl: https://example.com/avatar.png
                    bio: Learning algorithms
                    role: student
                    isActive: true
                    createdAt: '2026-11-07T00:00:00Z'
                    updatedAt: '2026-11-07T00:00:00Z'
          headers:
            Set-Cookie:
              description: refreshToken=<opaque>; HttpOnly; Secure in production; SameSite=Lax for same-site deployment; Path=/;
                Max-Age=604800. Rotation replaces cookie. Clear old Path=/auth cookie during adoption.
              schema: {type: string, example: refreshToken=mock-token; HttpOnly; Path=/; SameSite=Lax; Max-Age=604800}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '405': {$ref: '#/components/responses/Error405'}
        '409': {$ref: '#/components/responses/Error409'}
        '413': {$ref: '#/components/responses/Error413'}
        '422': {$ref: '#/components/responses/Error422'}
        '429': {$ref: '#/components/responses/Error429'}
        '500': {$ref: '#/components/responses/Error500'}
        '502': {$ref: '#/components/responses/Error502'}
        '504': {$ref: '#/components/responses/Error504'}
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Signed in
      tags:
      - Auth
      description: 'Wrong credentials: 401 INVALID_CREDENTIALS. Inactive account: 403 ACCOUNT_DISABLED. Target access TTL
        15 minutes; refresh cookie 7 days. Tokens in examples are mock placeholders.'
      security: []
      x-implementation-status: target-not-implemented
      x-owner: auth_service
      x-feature: F01
      x-priority: Must
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
            example: {email: learner@example.com, password: Coding2026}
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
              example:
                status: success
                code: 200
                message: Signed in
                data:
                  accessToken: mock-access-token
                  user:
                    id: 11111111-1111-4111-8111-111111111111
                    email: learner@example.com
                    username: bradar
                    fullName: Trung Hieu
                    avatarUrl: https://example.com/avatar.png
                    bio: Learning algorithms
                    role: student
                    isActive: true
                    createdAt: '2026-11-07T00:00:00Z'
                    updatedAt: '2026-11-07T00:00:00Z'
          headers:
            Set-Cookie:
              description: refreshToken=<opaque>; HttpOnly; Secure in production; SameSite=Lax for same-site deployment; Path=/;
                Max-Age=604800. Rotation replaces cookie. Clear old Path=/auth cookie during adoption.
              schema: {type: string, example: refreshToken=mock-token; HttpOnly; Path=/; SameSite=Lax; Max-Age=604800}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '405': {$ref: '#/components/responses/Error405'}
        '409': {$ref: '#/components/responses/Error409'}
        '413': {$ref: '#/components/responses/Error413'}
        '422': {$ref: '#/components/responses/Error422'}
        '429': {$ref: '#/components/responses/Error429'}
        '500': {$ref: '#/components/responses/Error500'}
        '502': {$ref: '#/components/responses/Error502'}
        '504': {$ref: '#/components/responses/Error504'}
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      summary: Session refreshed
      tags:
      - Auth
      description: 'Rotate opaque refresh token; missing/expired/replayed/revoked cookie: 401 REFRESH_TOKEN_INVALID. Enforce
        allowed Origin and SameSite/CSRF policy; no access Bearer required. Reuse revokes affected token chain.'
      security:
      - refreshCookie: []
      x-implementation-status: target-not-implemented
      x-owner: auth_service
      x-feature: F01
      x-priority: Must
      responses:
        '200':
          description: Session refreshed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefreshResponse'}
              example:
                status: success
                code: 200
                message: Session refreshed
                data:
                  accessToken: mock-access-token
                  user:
                    id: 11111111-1111-4111-8111-111111111111
                    email: learner@example.com
                    username: bradar
                    fullName: Trung Hieu
                    avatarUrl: https://example.com/avatar.png
                    bio: Learning algorithms
                    role: student
                    isActive: true
                    createdAt: '2026-11-07T00:00:00Z'
                    updatedAt: '2026-11-07T00:00:00Z'
          headers:
            Set-Cookie:
              description: refreshToken=<opaque>; HttpOnly; Secure in production; SameSite=Lax for same-site deployment; Path=/;
                Max-Age=604800. Rotation replaces cookie. Clear old Path=/auth cookie during adoption.
              schema: {type: string, example: refreshToken=mock-token; HttpOnly; Path=/; SameSite=Lax; Max-Age=604800}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '405': {$ref: '#/components/responses/Error405'}
        '409': {$ref: '#/components/responses/Error409'}
        '413': {$ref: '#/components/responses/Error413'}
        '422': {$ref: '#/components/responses/Error422'}
        '429': {$ref: '#/components/responses/Error429'}
        '500': {$ref: '#/components/responses/Error500'}
        '502': {$ref: '#/components/responses/Error502'}
        '504': {$ref: '#/components/responses/Error504'}
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Signed out
      tags:
      - Auth
      description: Idempotently revoke presented refresh cookie and clear both cookie paths, even if cookie is missing or
        expired. Enforce allowed Origin; no valid access token required.
      security: []
      x-implementation-status: target-not-implemented
      x-owner: auth_service
      x-feature: F01
      x-priority: Must
      responses:
        '204':
          description: Completed. No response body.
          headers:
            Set-Cookie:
              description: Clear refresh cookie at Path=/ and legacy Path=/auth; Max-Age=0. Password change/reset revokes
                all user refresh tokens.
              schema: {type: string, example: refreshToken=; HttpOnly; Path=/; Max-Age=0}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '405': {$ref: '#/components/responses/Error405'}
        '409': {$ref: '#/components/responses/Error409'}
        '413': {$ref: '#/components/responses/Error413'}
        '422': {$ref: '#/components/responses/Error422'}
        '429': {$ref: '#/components/responses/Error429'}
        '500': {$ref: '#/components/responses/Error500'}
        '502': {$ref: '#/components/responses/Error502'}
        '504': {$ref: '#/components/responses/Error504'}
  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Reset request received
      tags:
      - Auth
      description: Always the same 202 envelope with data null, regardless of email existence. Send one-use reset token out
        of band, expires in 30 minutes. Never return token. Requires reset-token persistence and email integration not present
        in schema.sql.
      security: []
      x-implementation-status: target-not-implemented
      x-owner: auth_service
      x-feature: F01
      x-priority: Should
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForgotPasswordRequest'}
            example: {email: learner@example.com}
      responses:
        '202':
          description: Reset request received
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ForgotPasswordResponse'}
              example: {status: success, code: 202, message: Reset request received, data: null}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '405': {$ref: '#/components/responses/Error405'}
        '409': {$ref: '#/components/responses/Error409'}
        '413': {$ref: '#/components/responses/Error413'}
        '422': {$ref: '#/components/responses/Error422'}
        '429': {$ref: '#/components/responses/Error429'}
        '500': {$ref: '#/components/responses/Error500'}
        '502': {$ref: '#/components/responses/Error502'}
        '504': {$ref: '#/components/responses/Error504'}
      x-schema-dependencies:
      - Add hashed expiring single-use password reset tokens; email delivery integration
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Password reset
      tags:
      - Auth
      description: 'Consume token atomically; expired/used/invalid token: 400 RESET_TOKEN_INVALID. Revoke all refresh tokens;
        existing access JWTs expire normally. Do not sign in automatically. Requires schema extension.'
      security: []
      x-implementation-status: target-not-implemented
      x-owner: auth_service
      x-feature: F01
      x-priority: Should
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
            example: {token: mock-single-use-reset-token, newPassword: Coding2026}
      responses:
        '204':
          description: Completed. No response body.
          headers:
            Set-Cookie:
              description: Clear refresh cookie at Path=/ and legacy Path=/auth; Max-Age=0. Password change/reset revokes
                all user refresh tokens.
              schema: {type: string, example: refreshToken=; HttpOnly; Path=/; Max-Age=0}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '405': {$ref: '#/components/responses/Error405'}
        '409': {$ref: '#/components/responses/Error409'}
        '413': {$ref: '#/components/responses/Error413'}
        '422': {$ref: '#/components/responses/Error422'}
        '429': {$ref: '#/components/responses/Error429'}
        '500': {$ref: '#/components/responses/Error500'}
        '502': {$ref: '#/components/responses/Error502'}
        '504': {$ref: '#/components/responses/Error504'}
      x-schema-dependencies:
      - Add hashed expiring single-use password reset tokens; email delivery integration
  /api/v1/users/me:
    get:
      operationId: getMe
      summary: Profile retrieved
      tags:
      - Profile
      description: Profile retrieved
      security:
      - bearerAuth: []
      x-implementation-status: target-not-implemented
      x-owner: auth_service
      x-feature: F01
      x-priority: Must
      responses:
        '200':
          description: Profile retrieved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GetMeResponse'}
              example:
                status: success
                code: 200
                message: Profile retrieved
                data:
                  user:
                    id: 11111111-1111-4111-8111-111111111111
                    email: learner@example.com
                    username: bradar
                    fullName: Trung Hieu
                    avatarUrl: https://example.com/avatar.png
                    bio: Learning algorithms
                    role: student
                    isActive: true
                    createdAt: '2026-11-07T00:00:00Z'
                    updatedAt: '2026-11-07T00:00:00Z'
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '405': {$ref: '#/components/responses/Error405'}
        '409': {$ref: '#/components/responses/Error409'}
        '413': {$ref: '#/components/responses/Error413'}
        '422': {$ref: '#/components/responses/Error422'}
        '429': {$ref: '#/components/responses/Error429'}
        '500': {$ref: '#/components/responses/Error500'}
        '502': {$ref: '#/components/responses/Error502'}
        '504': {$ref: '#/components/responses/Error504'}
    patch:
      operationId: updateMe
      summary: Profile updated
      tags:
      - Profile
      description: Only fullName/avatarUrl/bio. Omitted means unchanged, null clears. Email/username/role/isActive cannot
        be changed here. avatarUrl and bio have nullable schema columns; no upload endpoint or binary files.
      security:
      - bearerAuth: []
      x-implementation-status: target-not-implemented
      x-owner: auth_service
      x-feature: F01
      x-priority: Should
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfilePatch'}
            example: {fullName: Trung Hieu, avatarUrl: 'https://example.com/avatar.png', bio: Learning algorithms}
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UpdateMeResponse'}
              example:
                status: success
                code: 200
                message: Profile updated
                data:
                  user:
                    id: 11111111-1111-4111-8111-111111111111
                    email: learner@example.com
                    username: bradar
                    fullName: Trung Hieu
                    avatarUrl: https://example.com/avatar.png
                    bio: Learning algorithms
                    role: student
                    isActive: true
                    createdAt: '2026-11-07T00:00:00Z'
                    updatedAt: '2026-11-07T00:00:00Z'
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '405': {$ref: '#/components/responses/Error405'}
        '409': {$ref: '#/components/responses/Error409'}
        '413': {$ref: '#/components/responses/Error413'}
        '422': {$ref: '#/components/responses/Error422'}
        '429': {$ref: '#/components/responses/Error429'}
        '500': {$ref: '#/components/responses/Error500'}
        '502': {$ref: '#/components/responses/Error502'}
        '504': {$ref: '#/components/responses/Error504'}
  /api/v1/users/me/password:
    put:
      operationId: changePassword
      summary: Password changed
      tags:
      - Profile
      description: Verify current password (400 CURRENT_PASSWORD_INVALID), store bcrypt hash, revoke all refresh tokens and
        clear cookie. Return 204; frontend clears in-memory access token and signs in again. Other issued access tokens expire
        normally.
      security:
      - bearerAuth: []
      x-implementation-status: target-not-implemented
      x-owner: auth_service
      x-feature: F01
      x-priority: Should
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
            example: {currentPassword: Coding2026, newPassword: Coding2026}
      responses:
        '204':
          description: Completed. No response body.
          headers:
            Set-Cookie:
              description: Clear refresh cookie at Path=/ and legacy Path=/auth; Max-Age=0. Password change/reset revokes
                all user refresh tokens.
              schema: {type: string, example: refreshToken=; HttpOnly; Path=/; Max-Age=0}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '405': {$ref: '#/components/responses/Error405'}
        '409': {$ref: '#/components/responses/Error409'}
        '413': {$ref: '#/components/responses/Error413'}
        '422': {$ref: '#/components/responses/Error422'}
        '429': {$ref: '#/components/responses/Error429'}
        '500': {$ref: '#/components/responses/Error500'}
        '502': {$ref: '#/components/responses/Error502'}
        '504': {$ref: '#/components/responses/Error504'}
  /api/v1/public/landing:
    get:
      operationId: getLanding
      summary: Landing retrieved
      tags:
      - Landing
      description: Published counts and packages, active languages and top five all-time leaderboard users. No emails or user-specific
        progress; cacheable public aggregate.
      security: []
      x-implementation-status: target-not-implemented
      x-owner: api_gateway
      x-feature: F02
      x-priority: Must
      responses:
        '200':
          description: Landing retrieved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GetLandingResponse'}
              example:
                status: success
                code: 200
                message: Landing retrieved
                data:
                  stats: {problems: 36, users: 128, acceptedSubmissions: 300}
                  languages:
                  - {id: 11111111-1111-4111-8111-111111111111, slug: python3, name: Python 3, runtimeVersion: '3.12', fileExtension: .py}
                  featuredPackages:
                  - {id: 11111111-1111-4111-8111-111111111111, slug: arrays, name: Arrays, description: Practice arrays, displayOrder: 0,
                    totalProblems: 3}
                  topUsers:
                  - {rank: 1, userId: 11111111-1111-4111-8111-111111111111, username: bradar, avatarUrl: 'https://example.com/avatar.png',
                    solvedProblemCount: 3, acceptedSolutionCount: 4}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '405': {$ref: '#/components/responses/Error405'}
        '409': {$ref: '#/components/responses/Error409'}
        '413': {$ref: '#/components/responses/Error413'}
        '422': {$ref: '#/components/responses/Error422'}
        '429': {$ref: '#/components/responses/Error429'}
