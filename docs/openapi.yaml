components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
    refreshCookie: {type: apiKey, in: cookie, name: refreshToken}
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        status:
          type: string
          enum:
          - error
          example: error
        code: {type: integer, example: 400, minimum: 400, maximum: 599}
        message: {type: string, example: Invalid request}
        error: {type: string, example: VALIDATION_ERROR}
        details: {type: object, nullable: true, additionalProperties: true, example: null}
      additionalProperties: false
      required:
      - status
      - code
      - message
      - error
      - details
    PublicUser:
      type: object
      properties:
        id: {type: string, example: 11111111-1111-4111-8111-111111111111, format: uuid}
        username: {type: string, example: bradar}
        fullName: {type: string, example: Trung Hieu, nullable: true}
        avatarUrl: {type: string, example: 'https://example.com/avatar.png', nullable: true, format: uri}
      additionalProperties: false
      required:
      - id
      - username
      - fullName
      - avatarUrl
    User:
      type: object
      properties:
        id: {type: string, example: 11111111-1111-4111-8111-111111111111, format: uuid}
        email: {type: string, example: learner@example.com, format: email}
        username: {type: string, example: bradar}
        fullName: {type: string, example: Trung Hieu, nullable: true}
        avatarUrl: {type: string, example: 'https://example.com/avatar.png', nullable: true, format: uri}
        bio: {type: string, example: Learning algorithms, nullable: true}
        role:
          type: string
          enum:
          - student
          - teacher
          - admin
          example: student
        isActive: {type: boolean, example: true}
        createdAt: {type: string, example: '2026-11-07T00:00:00Z', format: date-time}
        updatedAt: {type: string, example: '2026-11-07T00:00:00Z', format: date-time}
      additionalProperties: false
      required:
      - id
      - email
      - username
      - fullName
      - avatarUrl
      - bio
      - role
      - isActive
      - createdAt
      - updatedAt
      description: Owner/admin only. avatarUrl and bio map to nullable users columns; email is never included in public authors/leaderboards.
    AuthData:
      type: object
      properties:
        accessToken: {type: string, example: mock-access-token, description: 'Opaque JWT to frontend; keep in memory, never
            localStorage.'}
        user: {$ref: '#/components/schemas/User'}
      additionalProperties: false
      required:
      - accessToken
      - user
    RegisterRequest:
      type: object
      properties:
        email: {type: string, example: learner@example.com, format: email, maxLength: 254}
        username: {type: string, example: bradar, minLength: 3, maxLength: 50, pattern: '^[A-Za-z0-9_]+$'}
        password:
          type: string
          example: Coding2026
          minLength: 8
          maxLength: 72
          pattern: ^(?=.*[A-Za-z])(?=.*[0-9]).{8,72}$
          description: 8+ characters, at least one ASCII letter and digit; at most 72 UTF-8 bytes for bcrypt, enforced by
            backend in addition to character limit.
          writeOnly: true
        fullName: {type: string, example: Trung Hieu, nullable: true, maxLength: 120}
      additionalProperties: false
      required:
      - email
      - username
      - password
    LoginRequest:
      type: object
      properties:
        email: {type: string, example: learner@example.com, format: email}
        password: {type: string, example: Coding2026, minLength: 1, writeOnly: true}
      additionalProperties: false
      required:
      - email
      - password
    ProfilePatch:
      type: object
      properties:
        fullName: {type: string, example: Trung Hieu, nullable: true, maxLength: 120}
        avatarUrl: {type: string, example: 'https://example.com/avatar.png', nullable: true, format: uri, maxLength: 2048}
        bio: {type: string, example: Learning algorithms, nullable: true, maxLength: 1000}
      additionalProperties: false
      minProperties: 1
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword: {type: string, example: Coding2026, writeOnly: true, minLength: 1}
        newPassword:
          type: string
          example: Coding2026
          minLength: 8
          maxLength: 72
          pattern: ^(?=.*[A-Za-z])(?=.*[0-9]).{8,72}$
          description: 8+ characters, at least one ASCII letter and digit; at most 72 UTF-8 bytes for bcrypt, enforced by
            backend in addition to character limit.
          writeOnly: true
      additionalProperties: false
      required:
      - currentPassword
      - newPassword
    ForgotPasswordRequest:
      type: object
      properties:
        email: {type: string, example: learner@example.com, format: email}
      additionalProperties: false
      required:
      - email
    ResetPasswordRequest:
      type: object
      properties:
        token: {type: string, example: mock-single-use-reset-token, minLength: 1, writeOnly: true}
        newPassword:
          type: string
          example: Coding2026
          minLength: 8
          maxLength: 72
          pattern: ^(?=.*[A-Za-z])(?=.*[0-9]).{8,72}$
          description: 8+ characters, at least one ASCII letter and digit; at most 72 UTF-8 bytes for bcrypt, enforced by
            backend in addition to character limit.
          writeOnly: true
      additionalProperties: false
      required:
      - token
      - newPassword
    Tag:
      type: object
      properties:
        id: {type: string, example: 11111111-1111-4111-8111-111111111111, format: uuid}
        slug: {type: string, example: arrays, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
        name: {type: string, example: Array}
      additionalProperties: false
      required:
      - id
      - slug
      - name
    Language:
      type: object
      properties:
        id: {type: string, example: 11111111-1111-4111-8111-111111111111, format: uuid}
        slug: {type: string, example: python3}
        name: {type: string, example: Python 3}
        runtimeVersion: {type: string, example: '3.12', description: Display label only; not an execution selector.}
        fileExtension: {type: string, example: .py}
      additionalProperties: false
      required:
      - id
      - slug
      - name
      - runtimeVersion
      - fileExtension
    Package:
      type: object
      properties:
        id: {type: string, example: 11111111-1111-4111-8111-111111111111, format: uuid}
        slug: {type: string, example: arrays, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
        name: {type: string, example: Arrays}
        description: {type: string, example: Practice arrays, nullable: true}
        displayOrder: {type: integer, example: 0, minimum: 0}
        totalProblems: {type: integer, example: 3, minimum: 0}
      additionalProperties: false
      required:
      - id
      - slug
      - name
      - description
      - displayOrder
      - totalProblems
    LevelProgress:
      type: object
      properties:
        id: {type: string, example: 11111111-1111-4111-8111-111111111111, format: uuid}
        packageId: {type: string, example: 11111111-1111-4111-8111-111111111111, format: uuid}
        levelNo: {type: integer, example: 1, minimum: 1, maximum: 3}
        slug: {type: string, example: easy}
        name: {type: string, example: Basic}
        difficulty:
          type: string
          enum:
          - easy
          - medium
          - hard
          example: easy
        total: {type: integer, example: 1, minimum: 0}
        solved: {type: integer, example: 0, minimum: 0}
        unlocked: {type: boolean, example: true}
        completed: {type: boolean, example: false}
      additionalProperties: false
      required:
      - id
      - packageId
      - levelNo
      - slug
      - name
      - difficulty
      - total
      - solved
      - unlocked
      - completed
    PackageDetail:
      type: object
      properties:
        package: {$ref: '#/components/schemas/Package'}
        levels:
          type: array
          items: {$ref: '#/components/schemas/LevelProgress'}
          minItems: 3
          maxItems: 3
          example:
          - id: 22222222-2222-4222-8222-222222222221
            packageId: 11111111-1111-4111-8111-111111111111
            levelNo: 1
            slug: easy
            name: Easy
            difficulty: easy
            total: 1
            solved: 0
            unlocked: true
            completed: false
          - id: 22222222-2222-4222-8222-222222222222
            packageId: 11111111-1111-4111-8111-111111111111
            levelNo: 2
            slug: medium
            name: Medium
            difficulty: medium
            total: 1
            solved: 0
            unlocked: false
            completed: false
          - id: 22222222-2222-4222-8222-222222222223
            packageId: 11111111-1111-4111-8111-111111111111
            levelNo: 3
            slug: hard
            name: Hard
            difficulty: hard
            total: 1
            solved: 0
            unlocked: false
            completed: false
      additionalProperties: false
      required:
      - package
      - levels
    Sample:
      type: object
      properties:
        id: {type: string, example: 11111111-1111-4111-8111-111111111111, format: uuid}
        inputData: {type: string, example: '1 2

            ', nullable: true}
        expectedOutput: {type: string, example: '3

            '}
        displayOrder: {type: integer, example: 1, minimum: 1}
      additionalProperties: false
      required:
      - id
      - inputData
      - expectedOutput
      - displayOrder
    ProblemSummary:
      type: object
      properties:
        id: {type: string, example: 11111111-1111-4111-8111-111111111111, format: uuid}
        slug: {type: string, example: sum-two}
        title: {type: string, example: Sum two numbers}
        packageId: {type: string, example: 11111111-1111-4111-8111-111111111111, format: uuid}
        packageSlug: {type: string, example: arrays, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
        levelId: {type: string, example: 11111111-1111-4111-8111-111111111111, format: uuid}
        difficulty:
          type: string
          enum:
          - easy
          - medium
          - hard
          example: easy
        tags:
          type: array
          items: {$ref: '#/components/schemas/Tag'}
        solved: {type: boolean, example: false}
        unlocked: {type: boolean, example: true}
        acceptanceRate: {type: number, example: 50, minimum: 0, maximum: 100}
      additionalProperties: false
      required:
      - id
      - slug
      - title
      - packageId
      - packageSlug
      - levelId
      - difficulty
      - tags
      - solved
      - unlocked
      - acceptanceRate
    ProblemDetail:
      type: object
      properties:
        problem: {$ref: '#/components/schemas/ProblemSummary'}
        statementMd: {type: string, example: Read two integers and print their sum.}
        executionMode:
          type: string
          enum:
          - stdin_stdout
          - function
