  /api/v1/packages:
    get:
      operationId: listPackages
      summary: Packages retrieved
      tags:
      - Catalog
      description: Only published packages, ordered displayOrder then id. Canonical packages replaces SRS categories; no categories
        alias or parent hierarchy.
      security:
      - bearerAuth: []
      x-implementation-status: target-not-implemented
      x-owner: api_gateway
      x-feature: F04
      x-priority: Must
      parameters:
      - name: page
        in: query
        required: false
        description: page
        schema: {type: integer, example: 1, minimum: 1, default: 1}
      - name: size
        in: query
        required: false
        description: size
        schema: {type: integer, example: 20, minimum: 1, maximum: 100, default: 20}
      - name: q
        in: query
        required: false
        description: q
        schema: {type: string, example: array}
      responses:
        '200':
          description: Packages retrieved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListPackagesResponse'}
              examples:
                populated:
                  value:
                    status: success
                    code: 200
                    message: Packages retrieved
                    data:
                      items:
                      - {id: 11111111-1111-4111-8111-111111111111, slug: arrays, name: Arrays, description: Practice arrays,
                        displayOrder: 0, totalProblems: 3}
                      page: 1
                      size: 20
                      total: 1
                empty:
                  value:
                    status: success
                    code: 200
                    message: Packages retrieved
                    data:
                      items: []
                      page: 1
                      size: 20
                      total: 0
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '405': {$ref: '#/components/responses/Error405'}
        '409': {$ref: '#/components/responses/Error409'}
        '413': {$ref: '#/components/responses/Error413'}
